# Build and start everything from an empty folder with two commands:
#   cp .env.example .env          (Windows: Copy-Item .env.example .env)
#   docker compose up -d --build
# Then open http://localhost:5173 and log in as QL_TT01 with DEMO_PASSWORD from .env.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-smartcrm}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # Only reachable from this machine (for scripts and tests on the host).
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrate, load the committed sample data and create demo accounts.
  # Safe to run again: nothing is duplicated and existing accounts are kept.
  init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/setup_all.py"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartcrm}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DATA_DIR: data/sample
    volumes:
      - demo_accounts:/app/data/processed
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartcrm}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - demo_accounts:/app/data/processed:ro
    depends_on:
      init:
        condition: service_completed_successfully

  # Unit tests in a container (no database needed): docker compose run --rm test
  # Not started by `docker compose up` because of the "test" profile.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: test
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      TEST_DB_NAME: smartcrm_test

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  demo_accounts:
