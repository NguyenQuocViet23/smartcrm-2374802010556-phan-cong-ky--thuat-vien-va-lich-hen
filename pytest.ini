[pytest]
pythonpath = src/backend
testpaths = tests
addopts = -v -rA --tb=short -m "not ui and not integration and not e2e and not system"
markers =
    ui: browser-based frontend tests requiring the Vite server
    integration: integration tests using PostgreSQL and the real API
    e2e: end-to-end main flow on the real frontend, backend and working database
    system: TC01–TC18 on the real frontend, a real backend and the real-data working database
